name: CI
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Validate deploy scripts and compose files
        run: |
          bash -n deploy/vm-setup.sh deploy/auto-update.sh
          docker compose -f docker-compose.yml config -q
          touch deploy/Caddyfile.generated
          docker compose -f docker-compose.yml -f deploy/compose.auth.yml config -q
